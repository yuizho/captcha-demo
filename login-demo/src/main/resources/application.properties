spring.application.name=login-demo

# パスキー (WebAuthn) の Relying Party 設定 (ローカル用)
app.webauthn.rp-name=login-demo
app.webauthn.rp-id=localhost
app.webauthn.allowed-origins=http://localhost:8080

# 実験用: Spring Security のフィルタ・認証の流れをログで観察する
logging.level.org.springframework.security=DEBUG

# 実験用: 実行される SQL (DEBUG) とバインドされるパラメータ (TRACE) をログで観察する
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=DEBUG

# 実験用: H2 Console を有効化 (http://localhost:8080/h2-console)
# JDBC URL は起動ログの "H2 console available at '/h2-console'. Database available at '...'" に出る
spring.h2.console.enabled=true
